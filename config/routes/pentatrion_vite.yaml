when@dev:
    _pentatrion_vite:
        # Nginx gère le proxy vers Vite, on ne proxifie que /build
        prefix: /build
        resource: "@PentatrionViteBundle/Resources/config/routing.yaml"

when@prod:
    _pentatrion_vite_prod:
        prefix: /build
        resource: "@PentatrionViteBundle/Resources/config/routing.yaml"
