security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Infrastructure\Security\User\HexagonalUserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Connecteur MCP (claude.ai, ChatGPT) : jeton OAuth, sans session, brouillons uniquement
        mcp:
            pattern: ^/mcp
            stateless: true
            custom_authenticators:
                - App\Security\OAuthBearerAuthenticator
            entry_point: App\Security\OAuthBearerAuthenticator

        # Lecture publique, mais session partagée avec `main` pour que access_control
        # et les règles `security` d'API Platform connaissent l'utilisateur connecté.
        api_public:
            pattern: ^/api
            lazy: true
            stateless: false
            provider: app_user_provider
            context: main
            entry_point: App\Security\ApiAuthenticationEntryPoint
            
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AuthAuthenticator
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                csrf_token_id: logout
                invalidate_session: true

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
         - { path: ^/mcp, roles: ROLE_AGENT_REDACTION }
         # Consentement OAuth : un administrateur autorise le connecteur (la connexion renvoie ici)
         - { path: ^/oauth/authorize, roles: ROLE_ADMIN }
         - { path: ^/admin, roles: ROLE_ADMIN }
         # Compte de la personne connectée (/user-api/me) et espace apprenant (/user-api/mon-espace)
         - { path: ^/user-api, roles: ROLE_USER }
         # Ressources API Platform : modification de son propre profil, le reste réservé aux admins
         - { path: ^/api/users, methods: [PATCH], roles: ROLE_USER }
         - { path: ^/api/users, roles: ROLE_ADMIN }
         - { path: ^/api, methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        #  - { path: ^/spa, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
